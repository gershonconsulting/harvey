<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Harvey · Emails to approve</title>
<style>
  :root {
    /* Gershon brand red: one variable, so the shade is a one-line change. */
    --gx-red: #FE1B04; --gx-red-dark: #d11200; --gx-red-tint: #fff5f5;
    --text: #1d1d1f; --muted: #6b7280; --border: #e5e7eb; --bg: #f7f7f8; --card: #fff;
    --ok: #15803d; --ok-tint: #f0fdf4; --warn: #b45309; --warn-tint: #fffbeb;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
  header { background: #fff; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 2; }
  .bar { max-width: 880px; margin: 0 auto; padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
  .logo { width: 30px; height: 30px; border-radius: 8px; background: var(--gx-red); color: #fff;
          display: grid; place-items: center; font-weight: 700; }
  .bar h1 { font-size: 17px; margin: 0; flex: 1; }
  .count { background: var(--gx-red-tint); color: var(--gx-red-dark); border-radius: 999px;
           padding: 2px 10px; font-weight: 600; font-size: 13px; }
  main { max-width: 880px; margin: 0 auto; padding: 16px; }
  .notice { border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; font-size: 14px;
            background: var(--warn-tint); color: var(--warn); border: 1px solid #fde68a; }
  .notice.info { background: #fff; color: var(--muted); border-color: var(--border); }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px;
          padding: 16px; margin-bottom: 14px; }
  .card.done { opacity: .55; }
  .who { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
  .who b { font-size: 16px; }
  .meta { color: var(--muted); font-size: 13px; }
  .meta a { color: var(--gx-red-dark); }
  .held { margin-top: 10px; background: var(--gx-red-tint); color: var(--gx-red-dark);
          border-radius: 8px; padding: 8px 10px; font-size: 13px; }
  details { margin-top: 8px; font-size: 13px; color: var(--muted); }
  label { display: block; font-size: 12px; font-weight: 600; color: var(--muted);
          text-transform: uppercase; letter-spacing: .03em; margin: 12px 0 4px; }
  input, textarea { width: 100%; font: inherit; color: var(--text); border: 1px solid var(--border);
                    border-radius: 8px; padding: 9px 10px; background: #fff; }
  input:focus, textarea:focus { outline: 2px solid var(--gx-red-tint); border-color: var(--gx-red); }
  textarea { min-height: 220px; resize: vertical; white-space: pre-wrap; }
  .footer-preview { white-space: pre-wrap; color: var(--muted); font-size: 13px;
                    border-left: 3px solid var(--border); padding-left: 10px; margin-top: 6px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; align-items: center; }
  button { font: inherit; font-weight: 600; border-radius: 8px; padding: 9px 16px; cursor: pointer;
           border: 1px solid var(--border); background: #fff; color: var(--text); }
  button.primary { background: var(--gx-red); border-color: var(--gx-red); color: #fff; }
  button.primary:hover { background: var(--gx-red-dark); }
  button:disabled { opacity: .5; cursor: default; }
  .msg { font-size: 13px; color: var(--muted); }
  .msg.err { color: var(--gx-red-dark); }
  .msg.ok { color: var(--ok); }
  .empty { text-align: center; color: var(--muted); padding: 48px 16px; }
</style>
</head>
<body>
<header><div class="bar">
  <div class="logo">G</div>
  <h1>Harvey · Emails to approve</h1>
  <span class="count" id="count" hidden></span>
</div></header>
<main>
  <div id="notices"></div>
  <div id="list"><p class="empty">Loading…</p></div>
</main>
<script>
(function () {
  "use strict";
  var list = document.getElementById("list");
  var notices = document.getElementById("notices");
  var countEl = document.getElementById("count");
  var footer = "";

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function post(path, body) {
    return fetch(path, {
      method: "POST", credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body || {})
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        j.status = r.status; return j;
      });
    });
  }

  function signedOut(message) {
    countEl.hidden = true;
    notices.textContent = "";
    list.textContent = "";
    var p = el("p", "empty", message ||
      "Open the newest link from a Harvey email to see the emails waiting for you.");
    list.appendChild(p);
  }

  function setCount() {
    var n = list.querySelectorAll(".card:not(.done)").length;
    countEl.hidden = false;
    countEl.textContent = n + " waiting";
    if (!n && !list.querySelector(".card")) {
      list.appendChild(el("p", "empty", "Nothing is waiting for your approval."));
    }
  }

  function card(item) {
    var c = el("div", "card");
    var ctx = item.context || {};
    var who = el("div", "who");
    who.appendChild(el("b", null, ctx.contact || item.to_email));
    who.appendChild(el("span", "meta",
      [ctx.contact_title, ctx.company].filter(Boolean).join(" · ")));
    c.appendChild(who);

    var meta = el("div", "meta");
    meta.appendChild(document.createTextNode("To " + item.to_email +
      (ctx.campaign ? " · Campaign: " + ctx.campaign : "") +
      (item.kind === "reply" ? " · Reply to their email" : " · Email " + (item.step || 1))));
    if (ctx.website && /^https?:\/\//i.test(ctx.website)) {
      meta.appendChild(document.createTextNode(" · "));
      var a = el("a", null, ctx.website.replace(/^https?:\/\//i, ""));
      a.href = ctx.website; a.target = "_blank"; a.rel = "noopener noreferrer";
      meta.appendChild(a);
    }
    c.appendChild(meta);

    if (item.held) c.appendChild(el("div", "held", "Harvey held this one for a closer look: " + item.held));

    var facts = [];
    if (ctx.description) facts.push("Company: " + ctx.description);
    if (ctx.notes) facts.push("Why this person: " + ctx.notes);
    Object.keys(ctx.signals || {}).forEach(function (k) { facts.push(k + ": " + ctx.signals[k]); });
    if (ctx.email_status) facts.push("Email address: " + ctx.email_status);
    if (facts.length) {
      var d = el("details");
      d.appendChild(el("summary", null, "What Harvey found about them"));
      facts.forEach(function (f) { d.appendChild(el("div", null, f)); });
      c.appendChild(d);
    }

    c.appendChild(el("label", null, "Subject"));
    var subj = el("input"); subj.value = item.subject || "";
    if (item.kind === "reply") { subj.readOnly = true; subj.title = "A reply keeps its subject."; }
    c.appendChild(subj);
    c.appendChild(el("label", null, "Email"));
    var body = el("textarea"); body.value = item.body || "";
    c.appendChild(body);
    if (footer && item.kind === "sequence") {
      c.appendChild(el("div", "footer-preview", "Added under it when sent:\n" + footer));
    }

    var actions = el("div", "actions");
    var approve = el("button", "primary", "Approve");
    var save = el("button", null, "Save changes");
    var reject = el("button", null, "Reject");
    var msg = el("span", "msg");
    save.disabled = true;
    actions.appendChild(approve); actions.appendChild(save); actions.appendChild(reject);
    actions.appendChild(msg);
    c.appendChild(actions);

    var saved = { s: subj.value, b: body.value };
    function dirty() { return subj.value !== saved.s || body.value !== saved.b; }
    function onInput() { save.disabled = !dirty(); msg.textContent = dirty() ? "Unsaved changes" : ""; msg.className = "msg"; }
    subj.addEventListener("input", onInput); body.addEventListener("input", onInput);

    function busy(on) { [approve, save, reject].forEach(function (b) { b.disabled = on; }); if (!on) save.disabled = !dirty(); }
    function fail(j) {
      if (j.status === 401) return signedOut(j.message);
      msg.className = "msg err"; msg.textContent = j.message || "That didn't work. Try again.";
      busy(false);
    }
    function finish(text) {
      c.classList.add("done"); msg.className = "msg ok"; msg.textContent = text;
      [approve, save, reject].forEach(function (b) { b.disabled = true; });
      subj.readOnly = true; body.readOnly = true; setCount();
    }
    function saveEdit() {
      if (!dirty()) return Promise.resolve({ success: true });
      return post("/review/api/" + encodeURIComponent(item.id) + "/edit",
                  { subject: subj.value, body: body.value }).then(function (j) {
        if (j.success) { saved = { s: subj.value, b: body.value }; }
        return j;
      });
    }

    save.addEventListener("click", function () {
      busy(true);
      saveEdit().then(function (j) {
        if (!j.success) return fail(j);
        busy(false); msg.className = "msg ok"; msg.textContent = "Saved. Still waiting for your approval.";
      });
    });
    approve.addEventListener("click", function () {
      var note = dirty() ? "\n\nYour changes will be saved first." : "";
      if (!window.confirm("Approve this email to " + item.to_email + "?\n\nHarvey will send it in its next sending window." + note)) return;
      busy(true);
      saveEdit().then(function (j) {
        if (!j.success) return fail(j);
        return post("/review/api/" + encodeURIComponent(item.id) + "/approve").then(function (j2) {
          if (!j2.success) return fail(j2);
          finish("Approved. Harvey will send it.");
        });
      });
    });
    reject.addEventListener("click", function () {
      if (!window.confirm("Reject this email to " + item.to_email + "? It will not be sent.")) return;
      busy(true);
      post("/review/api/" + encodeURIComponent(item.id) + "/reject").then(function (j) {
        if (!j.success) return fail(j);
        finish("Rejected. It won't be sent.");
      });
    });
    return c;
  }

  function load() {
    fetch("/review/api/pending", { credentials: "same-origin" }).then(function (r) {
      if (r.status === 401) { signedOut(); return null; }
      return r.json();
    }).then(function (data) {
      if (!data) return;
      footer = data.footer || "";
      notices.textContent = "";
      if (!data.can_send) {
        notices.appendChild(el("div", "notice",
          "No sending mailbox is connected yet, so approved emails wait in Harvey until one is. Nothing goes out from this page."));
      } else if (data.paused) {
        notices.appendChild(el("div", "notice", "Sending is paused in Harvey. Approved emails wait until it resumes."));
      }
      notices.appendChild(el("div", "notice info",
        "Each email goes out only after you press Approve on it. Rejected emails are never sent."));
      list.textContent = "";
      (data.items || []).forEach(function (item) { list.appendChild(card(item)); });
      setCount();
    }).catch(function () { signedOut("Couldn't load the emails. Refresh the page to try again."); });
  }

  // The key from the email link rides in the #fragment, so it never reaches
  // the server's logs. Trade it for a session, then take it off the address bar.
  var m = /[#&]k=([A-Za-z0-9_-]{43,128})/.exec(location.hash);
  if (m) {
    history.replaceState(null, "", location.pathname);
    post("/review/session", { key: m[1] }).then(function (j) {
      if (!j.success) return signedOut(j.message);
      load();
    });
  } else {
    load();
  }
})();
</script>
</body>
</html>
